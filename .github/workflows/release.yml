name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPOSITORY: WindDevil/clings
  W64DEVKIT_VERSION: "2.10.0"
  PYTHON_EMBED_VERSION: "3.12.10"

jobs:
  package:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Check out upstream clings
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          path: upstream

      - name: Sync the twin from upstream
        run: python tools/sync_from_source.py --source upstream

      # A release is the worst place to discover that the twin drifted from
      # upstream, and the LF-writing rule in tools/ only misbehaves on Windows.
      - name: Twin matches upstream
        run: python tools/sync_from_source.py --source upstream --check

      - name: Use the runner's MinGW-w64 toolchain
        run: |
          echo "CC=gcc" >> $env:GITHUB_ENV
          echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Verify every solution
        run: python clings verify --verbose

      - name: Exercises still start unsolved
        run: python clings selftest

      # A release is the worst place to find out the editor is broken, and
      # this is the job with the toolchain the package will actually bundle.
      - name: Studio tests
        run: python -m unittest discover -s studio/tests -t . -v

      # The packaging step decides whether the download works at all - the
      # bundled Python is the embeddable distribution, and it only finds the
      # studio because of the ._pth line these tests check for.
      - name: Packaging tests
        run: python -m unittest discover -s tools/tests -t . -v

      # The full package bundles the toolchain a learner would otherwise have to
      # install: w64devkit (mingw-w64 + make + gdb) and the embeddable Python.
      - name: Fetch the bundled runtime
        run: |
          $native = ".winbox\native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null

          $sfx = "$native\w64devkit.7z.exe"
          curl.exe -fSL -o $sfx "https://github.com/skeeto/w64devkit/releases/download/v$env:W64DEVKIT_VERSION/w64devkit-x64-$env:W64DEVKIT_VERSION.7z.exe"
          7z x -y "-o$native" $sfx | Out-Null

          $python = "$native\python.zip"
          curl.exe -fSL -o $python "https://www.python.org/ftp/python/$env:PYTHON_EMBED_VERSION/python-$env:PYTHON_EMBED_VERSION-embed-amd64.zip"
          Expand-Archive -Path $python -DestinationPath "$native\python" -Force

          Get-ChildItem $native | Select-Object Name

      - name: Build both packages
        run: python tools/package_windows.py

      - name: Inspect the packages
        run: Get-ChildItem dist | Select-Object Name, @{n = "MiB"; e = { [math]::Round($_.Length / 1MB, 1) } }

      # Everything above this line tested the checkout.  This is the only step
      # that tests what the learner downloads: unpack it, then drive it the
      # way a double-click does, with the Python that is inside the zip.
      - name: The built package works as shipped
        run: |
          Expand-Archive -Path (Get-ChildItem dist\*-full.zip).FullName -DestinationPath smoke
          $root = (Get-ChildItem smoke -Directory | Select-Object -First 1).FullName
          Push-Location $root
          try {
            # The embeddable Python ignores PYTHONPATH, so this is where a
            # missing `..\..` in runtime\python\python3xx._pth shows up - as
            # "No module named studio" in a learner's console.
            .\runtime\python\python.exe -c "import studio, studio.server"
            if ($LASTEXITCODE -ne 0) { throw "包里的 Python 导入不了 studio 模块" }
            .\runtime\python\python.exe -m studio --help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "包里的 Python 跑不了 python -m studio" }
            # ...and the entry point a double-click reaches: the exercise
            # fails on purpose, and the failure has to explain itself.
            $run = cmd /c ".\clings.cmd run 00_basics/01_printf" 2>&1 | Out-String
            if (-not $run.Contains("要改的文件")) { throw "失败的 run 没有给新手提示：$run" }
            # That run is supposed to fail - it is the exercise - and pwsh
            # would otherwise leave the step with its exit code of 1.
            $LASTEXITCODE = 0
            Write-Host "package smoke ok"
          } finally { Pop-Location }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clings-win-packages
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## 怎么用

            185 道 C 语言练习题。程序里的标识符和函数名保持英文，题目说明、提示和命令行
            输出都是中文。两个包按自己的情况挑一个，解压到哪都行（中文、带空格的路径也在
            验收清单里）：

            - `-full.zip`（约 190 MB）：自带编译器（w64devkit）和 Python，不用装任何开发
              工具，也不需要管理员权限。
            - `-slim.zip`（约 0.6 MB）：只有练习，需要自己装 Python 3 和 MinGW-w64 GCC。

            双击 `clings.cmd` 就开始：第一次运行先讲一遍用法（一共多少道题、要改哪个文件、
            一开始不通过是正常的），然后编译并测试第一道题，跑完停在菜单上，窗口不会一闪
            而过。菜单里 `1` 重跑、`2` 用 VS Code 打开、`3` 用浏览器里的内置编辑器打开、
            `4` 看提示。做过的题记在 `.clings\progress.json` 里，下次双击接着做没做完的
            那一道。

            每道题发到手上时都是坏的，留了一处空，编译器或测试框架报的错就是题目本身。
            第一次跑不通过属于正常流程；改完文件回到菜单按 `1` 重跑，通过之后它会告诉你
            下一道题在哪。

            只想用命令行的话，`list`、`run`、`hint`、`solution`、`reset`、`verify`、
            `doctor`、`open`、`web` 都有，用法见包里的 `README.md`。练习名写成
            `00_basics/01_printf` 这样的全名最省事。

            ## 关于这个包

            - 练习内容和上游 [clings](https://github.com/${{ env.UPSTREAM_REPOSITORY }}) 同步，
              差异只有三处：平台变体、运行器的 Windows 适配、中英对照表。打包和真机验收由
              CI 在 `windows-latest` 上跑完才发布。
            - 少数练习有 Windows 变体，清单和原因见 `docs/portability.md`。
            - 已知问题：v0.3.0 及更早的 `-full.zip` 里内置编辑器起不来（Python 找不到
              `studio` 模块，双击和 `clings.cmd web` 都受影响），`clings.cmd run` 正常。
              换这一版即可。

            这一版里学习者能感觉到的有两处。一是五道题（`00_basics/01_printf`、
            `00_basics/02_printf_values`、`00_basics/07_include_header`、
            `00_basics/09_compiler_diagnostics`、`13_character_io/05_getchar_putchar`）
            以前只检查 `printf` 返回的字符数，现在比较真正打印出来的文本：「长度对、
            内容错」的写法以前能通过，现在会被判错，失败信息里还会显示实际打印了什么
            （换行写成 `\n`，少写一个看得见）。二是内置编辑器：窗口压得很扁时，
            `保存 / 运行` 那一栏不会再被挤出屏幕。

            这一版具体改了什么，见下面的变更列表。
