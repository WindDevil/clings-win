name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  UPSTREAM_REPOSITORY: WindDevil/clings

jobs:
  # The twin is generated: this job proves it still matches upstream.
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out upstream clings
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          path: upstream
      - name: Twin matches upstream
        run: python3 tools/sync_from_source.py --source upstream --check

  # Fast loop: cross compile to PE and run through Wine on Linux.  No Windows
  # machine is involved, yet the binaries are real Windows binaries.
  wine-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out upstream clings
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          path: upstream
      - name: Sync twin
        run: python3 tools/sync_from_source.py --source upstream
      - name: Install cross compiler and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64-posix wine wine64 xvfb
      - name: Windows regression loop
        run: |
          printf '#include <stdio.h>\nint main(void) { return 0; }\n' > /tmp/warm.c
          x86_64-w64-mingw32-gcc-posix /tmp/warm.c -o /tmp/warm.exe
          xvfb-run -a bash -euc '
            export WINEDEBUG=-all
            export WINEDLLOVERRIDES=mscoree,mshtml=
            export CC=x86_64-w64-mingw32-gcc-posix
            export CLINGS_TARGET=windows
            export CLINGS_EXEC_PREFIX=wine

            # One cold start, then keep the Wine server alive: without this each
            # of the 370 programs pays a ~4 s startup.
            wine /tmp/warm.exe
            ( while :; do wine /tmp/warm.exe >/dev/null 2>&1; sleep 2; done ) &
            keepalive=$!
            trap "kill $keepalive 2>/dev/null || true" EXIT

            python3 clings verify --verbose
            python3 clings selftest
          '

  # Ground truth: a real Windows runner with a real MinGW toolchain.
  real-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Check out upstream clings
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          path: upstream
      - name: Sync twin
        run: python tools/sync_from_source.py --source upstream
      - name: Use the runner's MinGW-w64 toolchain
        run: |
          echo "CC=gcc" >> $env:GITHUB_ENV
          echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
      - name: Show toolchain
        run: |
          gcc --version
          python --version
          python clings doctor
      - name: Check the double-click entry point
        shell: cmd
        run: clings.cmd doctor
      - name: Verify every solution
        run: python clings verify --verbose
      - name: Exercises still start unsolved
        run: python clings selftest --verbose
      - name: Build the beginner package
        run: python tools/package_windows.py
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: clings-win-package
          path: dist/*.zip
          if-no-files-found: error
