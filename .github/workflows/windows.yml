name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  UPSTREAM_REPOSITORY: WindDevil/clings
  PYTHON_EMBED_VERSION: "3.12.10"

jobs:
  # The twin is generated: this job proves it still matches upstream.
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out upstream clings
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          path: upstream
      - name: Twin matches upstream
        run: python3 tools/sync_from_source.py --source upstream --check

  # Fast loop: cross compile to PE and run through Wine on Linux.  No Windows
  # machine is involved, yet the binaries are real Windows binaries.
  wine-loop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out upstream clings
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          path: upstream
      - name: Sync twin
        run: python3 tools/sync_from_source.py --source upstream
      - name: Install cross compiler and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64-posix wine wine64 xvfb
      - name: Windows regression loop
        run: |
          printf '#include <stdio.h>\nint main(void) { return 0; }\n' > /tmp/warm.c
          x86_64-w64-mingw32-gcc-posix /tmp/warm.c -o /tmp/warm.exe
          xvfb-run -a bash -euc '
            export WINEDEBUG=-all
            export WINEDLLOVERRIDES=mscoree,mshtml=
            export CC=x86_64-w64-mingw32-gcc-posix
            export CLINGS_TARGET=windows
            export CLINGS_EXEC_PREFIX=wine

            # One cold start, then keep the Wine server alive: without this each
            # of the 370 programs pays a ~4 s startup.
            wine /tmp/warm.exe
            ( while :; do wine /tmp/warm.exe >/dev/null 2>&1; sleep 2; done ) &
            keepalive=$!
            trap "kill $keepalive 2>/dev/null || true" EXIT

            python3 clings verify --verbose
            python3 clings selftest
          '
      # Upstream's users run on POSIX terminals, so the runner has to keep
      # colouring them.  A pipe cannot show that (the runner switches colour
      # off for anything that is not a terminal, by design) - only a pty can,
      # and `script` is the cheap way to get one.
      - name: Colour on a POSIX terminal
        run: |
          script -qec "python3 clings list" /dev/null > colour.txt
          if grep -q $'\033' colour.txt; then
            echo "colour on a pty: ok"
          else
            echo "runner did not colour a POSIX terminal"; exit 1
          fi
          if NO_COLOR=1 script -qec "python3 clings list" /dev/null | grep -q $'\033'; then
            echo "NO_COLOR ignored on a pty"; exit 1
          fi

  # Ground truth: a real Windows runner with a real MinGW toolchain.
  real-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Check out upstream clings
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          path: upstream
      - name: Sync twin
        run: python tools/sync_from_source.py --source upstream
      # ...and then prove the tree it just wrote is byte-identical to upstream
      # plus patches.  The ubuntu job cannot catch a regression here: text mode
      # writes LF there for free, and CRLF only ever appears on Windows.
      - name: Twin matches upstream
        run: python tools/sync_from_source.py --source upstream --check
      - name: Use the runner's MinGW-w64 toolchain
        run: |
          echo "CC=gcc" >> $env:GITHUB_ENV
          echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
      - name: Show toolchain
        run: |
          gcc --version
          python --version
          python clings doctor
      # The entry point has to work when *typed* too, and the two Windows
      # shells only agree on one spelling: cmd.exe rejects a leading "./" while
      # PowerShell never searches the current directory.  `.\clings.cmd` is it,
      # and this is the step that notices when a doc drifts back to `clings.cmd`.
      - name: Check the double-click entry point
        shell: cmd
        run: .\clings.cmd doctor
      - name: Check the entry point from PowerShell
        shell: pwsh
        run: .\clings.cmd doctor
      - name: Learner commands in the topic READMEs are runnable here
        shell: pwsh
        run: |
          $bad = Select-String -Path exercises/*/README.md `
                              -Pattern '^\s*(\./clings|clings\.cmd)\b' `
                              -ErrorAction SilentlyContinue
          if ($bad) {
            $bad | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)" }
            throw "a topic README tells the learner to run a command that fails in cmd or PowerShell"
          }
      - name: Verify every solution
        run: python clings verify --verbose
      - name: Exercises still start unsolved
        run: python clings selftest
      # The studio against the real runner, the real compiler and the real
      # exercises.  It runs here rather than only in wine-loop because the
      # double-click entry point and the VS Code lookup are Windows things.
      - name: Studio tests
        run: python -m unittest discover -s studio/tests -t . -v
      # The packaging step is where a released download can be broken while
      # every test above is green - see docs/portability.md, "自带的 Python".
      - name: Packaging tests
        run: python -m unittest discover -s tools/tests -t . -v
      # Escapes must not reach a pipe, and forcing them must still work: a
      # learner pasting a failing run into a chat is the case that hurts.
      # (A real console, where clings turns VT processing on itself, is
      # covered by the manual smoke test - CI has no console to render to.)
      - name: Colour stays out of pipelines
        run: |
          $esc = [char]27
          [Console]::OutputEncoding = [Text.UTF8Encoding]::new()
          if ((python clings list | Out-String).Contains($esc)) {
            throw "escapes leaked into piped output"
          }
          $env:CLINGS_COLOR = "always"
          if (-not (python clings list | Out-String).Contains($esc)) {
            throw "CLINGS_COLOR=always was ignored"
          }
          Remove-Item Env:\CLINGS_COLOR
          $env:NO_COLOR = "1"
          if ((python clings list | Out-String).Contains($esc)) {
            throw "NO_COLOR was ignored"
          }
          Remove-Item Env:\NO_COLOR
          if (-not (python clings doctor | Out-String).Contains("颜色")) {
            throw "doctor does not report the colour decision"
          }
          Write-Host "colour policy ok"
      # The full package needs w64devkit, which is 750 MB of download - this
      # job only needs the Python half of it to check the part that broke in
      # v0.3.0.  The exercises run against the mingw-w64 already on PATH.
      - name: Fetch the embedded Python
        run: |
          $native = ".winbox\native"
          New-Item -ItemType Directory -Force -Path $native | Out-Null
          $zip = "$native\python.zip"
          curl.exe -fSL -o $zip "https://www.python.org/ftp/python/$env:PYTHON_EMBED_VERSION/python-$env:PYTHON_EMBED_VERSION-embed-amd64.zip"
          Expand-Archive -Path $zip -DestinationPath "$native\python" -Force
      - name: Build the beginner packages
        run: python tools/package_windows.py --flavor both --allow-missing-runtime
      - name: The packaged entry point works as shipped
        run: |
          Expand-Archive -Path (Get-ChildItem dist\*-full.zip).FullName -DestinationPath smoke
          $root = (Get-ChildItem smoke -Directory | Select-Object -First 1).FullName
          Push-Location $root
          try {
            # Importing studio from the bundled Python is the whole check: a
            # ._pth file switches PYTHONPATH off, so it only works when
            # tools/package_windows.py wrote this package's root into it.
            .\runtime\python\python.exe -c "import studio, studio.server"
            if ($LASTEXITCODE -ne 0) { throw "包里的 Python 导入不了 studio 模块" }
            # ...and the entry point a double-click reaches.
            $run = cmd /c ".\clings.cmd run 00_basics/01_printf" 2>&1 | Out-String
            if (-not $run.Contains("要改的文件")) { throw "失败的 run 没有给新手提示：$run" }
            Write-Host "package smoke ok"
          } finally { Pop-Location }
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: clings-win-package
          path: dist/*.zip
          if-no-files-found: error
