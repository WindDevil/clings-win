<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The server replaces this at startup.  Every request carries it back, so a
     page that did not come from this server cannot drive it. -->
<meta name="clings-token" content="__CLINGS_TOKEN__">
<title>clings 内置编辑器</title>
<link rel="stylesheet" href="/static/vendor/codemirror/lib/codemirror.css">
<link rel="stylesheet" href="/static/vendor/codemirror/addon/lint/lint.css">
<link rel="stylesheet" href="/static/vendor/codemirror/addon/hint/show-hint.css">
<link rel="stylesheet" href="/static/vendor/codemirror/addon/fold/foldgutter.css">
<link rel="stylesheet" href="/static/vendor/codemirror/addon/dialog/dialog.css">
<link rel="stylesheet" href="/static/vendor/codemirror/theme/eclipse.css">
<link rel="stylesheet" href="/static/vendor/codemirror/theme/material-darker.css">
<link rel="stylesheet" href="/static/ui.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">clings</span>
    <span class="brand-sub">内置编辑器</span>
  </div>
  <div class="topbar-right">
    <div class="progress" id="progress" title="已完成 / 全部">
      <div class="progress-bar"><span id="progress-fill"></span></div>
      <span id="progress-text">…</span>
    </div>
    <button id="theme-button" class="ghost" title="切换深色 / 浅色">深色</button>
    <button id="vscode-button" class="ghost" title="用 VS Code 打开这个练习">在 VS Code 中打开</button>
  </div>
</header>

<main>
  <aside class="sidebar">
    <div class="search-box">
      <input id="search" type="search" placeholder="搜索练习（名字或标题）" autocomplete="off">
    </div>
    <nav id="tree" class="tree" aria-label="练习列表"></nav>
  </aside>

  <section class="workspace">
    <div class="exercise-head">
      <div class="exercise-title-row">
        <h1 id="exercise-title">正在载入…</h1>
        <div class="exercise-nav">
          <button id="previous-button" class="ghost" title="上一个练习">↑</button>
          <button id="next-button" class="ghost" title="下一个练习">↓</button>
        </div>
      </div>
      <div class="exercise-meta">
        <code id="exercise-ident"></code>
        <span class="dot">·</span>
        <span id="exercise-topic"></span>
        <span id="exercise-flags"></span>
      </div>
      <p id="exercise-objective" class="objective"></p>
      <details id="hint-box" class="disclosure" hidden>
        <summary>提示</summary>
        <p id="exercise-hint"></p>
      </details>
      <details id="readme-box" class="disclosure" hidden>
        <summary>本章说明（来自 exercises/&lt;章节&gt;/README.md）</summary>
        <div id="readme" class="markdown"></div>
      </details>
    </div>

    <div class="editor-area">
      <div id="tabs" class="tabs" role="tablist"></div>
      <div class="editor-host">
        <div id="editor"></div>
        <div id="editor-placeholder" class="editor-placeholder">选择左边的一个练习开始。</div>
      </div>
    </div>

    <div class="actions">
      <button id="save-button" class="primary">保存 <kbd>Ctrl-S</kbd></button>
      <button id="run-button">运行 <kbd>Ctrl-Enter</kbd></button>
      <button id="check-button">检查语法</button>
      <!-- The message is the row's flexible slot, not a trailing item: here the
           empty space already is, so a message appearing cannot shift a button. -->
      <span id="status" class="status"></span>
      <button id="solution-button" class="ghost">看参考答案</button>
      <button id="apply-button" class="ghost" title="用参考答案覆盖你的文件">套用参考实现</button>
      <button id="reset-button" class="ghost" title="恢复练习的初始内容">重置</button>
    </div>

    <div class="bottom">
      <section class="output-panel">
        <div class="panel-head">
          <span>运行输出</span>
          <span id="output-meta" class="muted"></span>
          <span class="spacer"></span>
          <button id="clear-output" class="ghost small">清空</button>
        </div>
        <pre id="output" class="output"></pre>
      </section>

      <section class="problems-panel">
        <div class="panel-head">
          <span>诊断</span>
          <span id="problems-meta" class="muted"></span>
          <span class="spacer"></span>
          <label class="stdin-label" for="stdin">运行时的键盘输入</label>
          <input id="stdin" class="stdin" type="text" placeholder="例如：42" autocomplete="off">
        </div>
        <div id="problems" class="problems"></div>
      </section>
    </div>
  </section>
</main>

<script src="/static/vendor/codemirror/lib/codemirror.js"></script>
<script src="/static/vendor/codemirror/mode/clike/clike.js"></script>
<script src="/static/vendor/codemirror/addon/lint/lint.js"></script>
<script src="/static/vendor/codemirror/addon/hint/show-hint.js"></script>
<script src="/static/vendor/codemirror/addon/edit/matchbrackets.js"></script>
<script src="/static/vendor/codemirror/addon/edit/closebrackets.js"></script>
<script src="/static/vendor/codemirror/addon/fold/foldcode.js"></script>
<script src="/static/vendor/codemirror/addon/fold/foldgutter.js"></script>
<script src="/static/vendor/codemirror/addon/fold/brace-fold.js"></script>
<script src="/static/vendor/codemirror/addon/fold/comment-fold.js"></script>
<script src="/static/vendor/codemirror/addon/selection/active-line.js"></script>
<script src="/static/vendor/codemirror/addon/search/search.js"></script>
<script src="/static/vendor/codemirror/addon/search/searchcursor.js"></script>
<script src="/static/vendor/codemirror/addon/search/jump-to-line.js"></script>
<script src="/static/vendor/codemirror/addon/dialog/dialog.js"></script>
<script src="/static/vendor/marked/marked.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
